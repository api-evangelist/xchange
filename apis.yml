aid: xchange
name: xChange
description: Container xChange is a Hamburg-founded B2B online marketplace and operating
  platform for shipping containers, where container owners, users, traders, and lessors
  buy, sell, and lease standard and special containers worldwide. The platform covers
  container trading, one-way and long-term leasing, payment handling via the xChange
  Wallet, insurance, container tracking, and market-price insights, plus a live North
  America container inventory storefront. xChange publishes no public developer API;
  its xChange Connect integrations (customer supply-listing feeds and depot container-movement
  reporting) accept data via API or spreadsheet but are onboarded privately through
  an account manager.
